<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل الرسالة</title>
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f0f4f8; padding: 40px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 16px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { background: #1a237e; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✏️ تعديل الرسالة</h1>
        <form action="/update/{{ msg[0] }}" method="POST">
            <input type="text" name="name" value="{{ msg[1] }}" required>
            <input type="email" name="email" value="{{ msg[2] }}" required>
            <textarea name="message" rows="4" required>{{ msg[3] }}</textarea>
            <button type="submit">💾 حفظ التعديلات</button>
        </form>
        <br>
        <a href="/messages">🔙 العودة إلى القائمة</a>
    </div>
</body>
</html>
