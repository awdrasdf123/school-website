<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرستي - النظام المتكامل</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== الأساسيات ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: #f0f4f8;
            color: #1e293b;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: #1a237e;
            text-align: center;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .hero-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        /* ===== النموذج ===== */
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            background: #1a237e;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #0d1445;
        }

        /* ===== شات بوت ===== */
        #chat-box {
            border: 1px solid #ddd;
            padding: 15px;
            max-height: 250px;
            overflow-y: auto;
            background: #f9fafc;
            border-radius: 12px;
            margin: 15px 0;
        }

        #chat-box p {
            margin: 6px 0;
        }

        #chat-box .user {
            color: #1a237e;
        }
        #chat-box .bot {
            color: #0d9488;
        }

        .chat-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .chat-input input {
            flex: 1;
        }

        /* ===== أزرار ===== */
        .btn-toggle {
            background: #1a237e;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px 0;
        }

        .btn-toggle:hover {
            background: #0d1445;
        }

        .hidden-section {
            display: none;
            background: #f1f5f9;
            padding: 20px;
            border-radius: 16px;
            margin-top: 15px;
        }

        /* ===== الروابط ===== */
        a {
            color: #1a237e;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== العنوان ===== -->
    <h1><i class="fas fa-school"></i> مدرستي</h1>

    <!-- ===== صورة متغيرة تلقائياً ===== -->
    <div style="text-align: center; font-size: 80px; color: #fbbf24: margin: 20px 0;">
    <i class="fas fa-book-open"></i>
    </div>

    <!-- ===== الوقت والتاريخ ===== -->
    <p style="text-align: center; font-size: 18px; color: #475569;">
        🕒 <span id="datetime"></span>
    </p>

    <!-- ===== زر إظهار/إخفاء ===== -->
    <button class="btn-toggle" onclick="toggleSection()">📂 إظهار/إخفاء الأخبار</button>

    <div id="newsSection" class="hidden-section">
        <h3>📰 آخر الأخبار</h3>
        <p>تم إعلان نتائج الامتحانات النهائية.</p>
        <p>سيُقام يوم الرياضة يوم الخميس القادم.</p>
    </div>

    <!-- ===== نموذج الاتصال (يُرسل إلى /submit) ===== -->
    <h2 style="margin-top: 30px;">📬 تواصل معنا</h2>
    <form action="/submit" method="POST">
        <input type="text" name="name" placeholder="الاسم الكامل" required>
        <input type="email" name="email" placeholder="البريد الإلكتروني" required>
        <textarea name="message" rows="4" placeholder="رسالتك..." required></textarea>
        <button type="submit"><i class="fas fa-paper-plane"></i> إرسال</button>
    </form>

    <!-- ===== شات بوت بسيط ===== -->
    <h2 style="margin-top: 30px;">💬 تحدث مع الروبوت</h2>
    <div id="chat-box">
        <p><strong class="bot">🤖 الروبوت:</strong> مرحباً! كيف يمكنني مساعدتك؟</p>
    </div>

    <div class="chat-input">
        <input type="text" id="userInput" placeholder="اكتب سؤالك هنا...">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <!-- ===== رابط عرض الرسائل ===== -->
    <p style="margin-top: 20px; text-align: center;">
        <a href="/messages">📬 عرض جميع الرسائل</a>
    </p>

</div>

<!-- ============================================================ -->
<!-- جافا سكريبت (JavaScript)                                     -->
<!-- ============================================================ -->
<script>
    // ===== 1. تحديث الوقت والتاريخ =====
    function updateTime() {
        var now = new Date();
        document.getElementById('datetime').innerHTML = now.toLocaleString('ar-EG');
    }
    setInterval(updateTime, 1000);
    updateTime();

    // ===== 2. إظهار وإخفاء القسم =====
    function toggleSection() {
        var section = document.getElementById('newsSection');
        if (section.style.display === 'block') {
            section.style.display = 'none';
        } else {
            section.style.display = 'block';
        }
    }

    // ===== 3. تغيير الصورة التلقائي =====
    var images = [
        "https://via.placeholder.com/800x300/1a237e/ffffff?text=صورة+1",
        "https://via.placeholder.com/800x300/0d9488/ffffff?text=صورة+2",
        "https://via.placeholder.com/800x300/92400e/ffffff?text=صورة+3"
    ];
    var currentIndex = 0;

    function changeHeroImage() {
        currentIndex = (currentIndex + 1) % images.length;
        document.getElementById('heroImage').src = images[currentIndex];
    }
    setInterval(changeHeroImage, 3000);

    // ===== 4. شات بوت (يرسل إلى /chat) =====
    function sendMessage() {
        var input = document.getElementById('userInput');
        var msg = input.value.trim();
        if (msg === "") return;

        var chatBox = document.getElementById('chat-box');
        chatBox.innerHTML += `<p><strong class="user">🧑 أنت:</strong> ${msg}</p>`;

        fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'message=' + encodeURIComponent(msg)
        })
        .then(response => response.text())
        .then(reply => {
            chatBox.innerHTML += `<p><strong class="bot">🤖 الروبوت:</strong> ${reply}</p>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        input.value = '';
    }

    // إرسال الرسالة بالضغط على Enter
    document.getElementById('userInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
