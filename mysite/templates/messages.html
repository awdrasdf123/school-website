<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جميع الرسائل</title>
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f0f4f8; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 16px; overflow: hidden; }
        th { background: #1a237e; color: white; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        a { margin: 0 6px; text-decoration: none; }
        .delete { color: red; }
        .edit { color: #1a237e; }
    </style>
</head>
<body>
    <div style="max-width: 1000px; margin: auto;">
        <h1>📬 جميع الرسائل</h1>
        <a href="/">🔙 العودة إلى الرئيسية</a>
        <table>
            <tr>
                <th>#</th>
                <th>الاسم</th>
                <th>البريد</th>
                <th>الرسالة</th>
                <th>التاريخ</th>
                <th>إجراء</th>
            </tr>
            {% for msg in messages %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ msg[1] }}</td>
                <td>{{ msg[2] }}</td>
                <td>{{ msg[3] }}</td>
                <td>{{ msg[4] }}</td>
                <td>
                    <a href="/edit/{{ msg[0] }}" class="edit">✏️ تعديل</a>
                    <a href="/delete/{{ msg[0] }}" class="delete" onclick="return confirm('هل أنت متأكد؟')">🗑️ حذف</a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
